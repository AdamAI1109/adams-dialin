<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#405247">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style-v137.css">
<title>Adam's Dial-in</title>
<script>
(function(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){r.unregister();});
    }).catch(function(){});
  }
  if(window.caches){
    caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){return caches.delete(k);}));
    }).catch(function(){});
  }
})();
</script>
</head>
<body>
<header>
  <img src="./adams-logo-exact.svg?v=139" class="brand-logo" alt="Adam's">
  <div><div class="eyebrow">ADAM'S ESPRESSO LAB</div><h1>Dial-in</h1><div class="sub">MYG85 · BUNKER #8 · IMS 28.5E</div></div>
  <span class="ver">v1.39</span>
</header>

<main>
<section class="card">
  <div class="section-head"><b>현재 세팅</b><span>STEP 1</span></div>
  <div class="roasts">
    <button data-roast="light">LIGHT</button><button class="on" data-roast="medium">MEDIUM</button>
    <button data-roast="mediumdark">MEDIUM DARK</button><button data-roast="dark">DARK</button>
  </div>
</section>

<section class="card">
  <div class="section-head"><b>MYG85 노브</b><span>STEP 2</span></div>
  <div class="knob-wrap">
    <div class="pointer">▼</div>
    <div id="knob" class="knob">
      <div id="dial" class="dial"></div>
      <img src="./adams-logo-exact.svg?v=139" class="center-logo" alt="">
    </div>
    <div class="dir"><span>COARSE</span><span>FINE</span></div>
  </div>
  <div class="live">
    <div><small>현재 노브</small><strong id="knobText">0+9.0</strong></div>
    <div><small>예상 간격</small><strong id="umText">153 µm</strong></div>
    <div><small>추출 비율</small><strong id="ratioText">1:1.66</strong></div>
  </div>
</section>

<section class="card">
  <div class="section-head"><b>현재 샷</b><span>STEP 3</span></div>
  <div class="grid">
    <label>도징량 g
      <div class="num-control"><button type="button" class="step-btn minus" data-target="dose" aria-label="도징량 줄이기">−</button><input id="dose" type="number" step=".1" value="22.0"><button type="button" class="step-btn plus" data-target="dose" aria-label="도징량 늘리기">+</button></div>
    </label>
    <label>추출량 g
      <div class="num-control"><button type="button" class="step-btn minus" data-target="yield" aria-label="추출량 줄이기">−</button><input id="yield" type="number" step=".1" value="35.0"><button type="button" class="step-btn plus" data-target="yield" aria-label="추출량 늘리기">+</button></div>
    </label>
    <label>추출시간 s
      <div class="num-control"><button type="button" class="step-btn minus" data-target="time" aria-label="추출시간 줄이기">−</button><input id="time" type="number" step="1" value="27"><button type="button" class="step-btn plus" data-target="time" aria-label="추출시간 늘리기">+</button></div>
    </label>
    <label>온도 °C
      <div class="num-control"><button type="button" class="step-btn minus" data-target="temp" aria-label="온도 낮추기">−</button><input id="temp" type="number" step="1" value="92"><button type="button" class="step-btn plus" data-target="temp" aria-label="온도 높이기">+</button></div>
    </label>
  </div>
</section>

<section class="card">
  <div class="section-head"><b>맛 입력</b><span>STEP 4</span></div>
  <div class="quick"><button data-preset="sour">시다</button><button data-preset="bitter">쓰다</button><button data-preset="mixed">쓰고 시다</button></div>
  <div id="sliders"></div>
</section>

<section id="result" class="card result hidden">
  <span id="badge" class="badge">진단</span>
  <h2 id="headline"></h2>
  <div class="compare"><div><small>현재</small><b id="cur"></b></div><span>→</span><div><small>목표</small><b id="target"></b></div></div>
  <div id="reason" class="reason"></div>
  <div id="plan" class="plan"></div>
  <button id="saveShot" class="secondary">이 샷 저장</button>
  <div id="history"></div>
</section>
</main>

<div class="sticky"><button id="analyze">다음 샷 추천</button><button id="reset">초기화</button></div>
<script src="./app-v139.js"></script>
<!-- pages-redeploy-137 -->
</body>
</html>

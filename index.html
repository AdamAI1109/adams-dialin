<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#405247"><link rel="manifest" href="./manifest.webmanifest"><title>Adam's Dial-in</title></head><body style="margin:0;background:#F6F1E8"><script>
(async()=>{const ps=await Promise.all([1,2,3].map(n=>fetch(`./payload${n}.txt`).then(r=>{if(!r.ok)throw new Error(`payload${n} ${r.status}`);return r.text()})));const b=ps.join('').replace(/\s/g,'');const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close();})().catch(e=>{document.body.innerHTML='<pre style="padding:20px;font-family:sans-serif">Adam\'s Dial-in load error\n'+e+'</pre>'});
</script></body></html>
